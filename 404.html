<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | MrWhiteLaurelTech</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <main class="hero" style="min-height:100vh;display:grid;place-items:center">
    <div class="container hero-inner">
      <p class="eyebrow">Error 404</p>
      <h1>Page <span class="gradient-text">not found</span></h1>
      <p class="lead">The page you are looking for does not exist or has moved.</p>
      <a href="/" class="btn btn-primary">Back to home</a>
    </div>
  </main>
</body>
</html>
